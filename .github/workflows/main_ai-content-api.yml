name: Build and deploy Python app to Azure Web App - ai-content-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies locally (Validation)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r backend/requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/ # Envia apenas o conteúdo da pasta backend para a raiz do pacote do Azure

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_004D995603B24574A053984B64C35986 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_333FE07FF1774D2986012A70E9D09350 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_78273BE0CAA74BF7AEADA7551E21AEEA }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ai-content-api'
          slot-name: 'Production'
          package: './backend'
          startup-command: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app'
